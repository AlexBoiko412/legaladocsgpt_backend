volumes:
  maven-cache:
  doc-storage:

services:
  auth-db:
    ports:
      - "5433:5432"

  document-db:
    ports:
      - "5434:5432"

  template-db:
    ports:
      - "27017:27017"

  redis:
    ports:
      - "6379:6379"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"

  gotenberg:
    ports:
      - "3020:3000"

  onlyoffice-ds:
    ports:
      - "8089:80"
    environment:
      - DS_ADDR=onlyoffice-ds

  init-shared:
    image: maven:3.9.9-eclipse-temurin-21
    volumes:
      - .:/app
      - maven-cache:/root/.m2
    working_dir: /app
    command: mvn install -DskipTests -pl shared -am -B

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile.dev
      args:
        SERVICE_PATH: auth-service
    ports:
      - "8081:8081"
    volumes:
      - .:/app
      - maven-cache:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_SMTP_AUTH: "false"
      MAIL_SMTP_STARTTLS: "false"
      SITE_URL: http://localhost:3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      init-shared:
        condition: service_completed_successfully
      auth-db:
        condition: service_healthy
    networks:
      - backend
      - database

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile.dev
      args:
        SERVICE_PATH: api-gateway
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - maven-cache:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: dev
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      init-shared:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
      document-generator:
        condition: service_healthy
      template-service:
        condition: service_healthy
      storage-service:
        condition: service_healthy
    networks:
      - backend

  document-generator:
    build:
      context: .
      dockerfile: document-generator/Dockerfile.dev
      args:
        SERVICE_PATH: document-generator
    ports:
      - "8082:8082"
    volumes:
      - .:/app
      - maven-cache:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://document-db:5432/document_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      SPRING_DATA_REDIS_HOST: redis
      EDIT_TOKEN_SECRET: ${EDIT_TOKEN_SECRET}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
      ONLYOFFICE_INTERNAL_URL: http://onlyoffice-ds:80
      STORAGE_SERVICE_URL: http://storage-service:8084
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      init-shared:
        condition: service_completed_successfully
      document-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-service:
        condition: service_healthy
    networks:
      - backend
      - database

  document-worker:
    build:
      context: .
      dockerfile: document-worker/Dockerfile.dev
      args:
        SERVICE_PATH: document-worker
    ports:
      - "8085:8085"
    volumes:
      - .:/app
      - maven-cache:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://document-db:5432/document_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      AI_PROVIDER: ${AI_PROVIDER}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_REGION: us-east-1
      S3_BUCKET: legaldocs
      GOTENBERG_URL: http://gotenberg:3000
      STORAGE_SERVICE_URL: http://storage-service:8084
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      init-shared:
        condition: service_completed_successfully
      document-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - backend
      - database

  storage-service:
    build:
      context: .
      dockerfile: storage-service/Dockerfile.dev
      args:
        SERVICE_PATH: storage-service
    ports:
      - "8084:8084"
    volumes:
      - .:/app
      - maven-cache:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_REGION: us-east-1
      S3_BUCKET: legaldocs
      EDIT_TOKEN_SECRET: ${EDIT_TOKEN_SECRET}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      init-shared:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    networks:
      - backend

  template-service:
    build:
      context: .
      dockerfile: template-service/Dockerfile.dev
      args:
        SERVICE_PATH: template-service
    ports:
      - "8083:8083"
    volumes:
      - .:/app
      - maven-cache:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      SPRING_DATA_MONGODB_URI: mongodb://template-db:27017/templates_db
      SPRING_DATA_REDIS_HOST: redis
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_REGION: us-east-1
      S3_BUCKET: legaldocs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      init-shared:
        condition: service_completed_successfully
      template-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-service:
        condition: service_healthy
    networks:
      - backend
      - database