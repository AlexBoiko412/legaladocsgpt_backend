server:
  port: 8081


app:
  oauth2:
    redirectUri: ${OAUTH2_SUCCESS_REDIRECT:http://localhost:3000/oauth2/success}
  cookie:
    secure: ${COOKIE_SECURE:false}
  seed:
    admin-password: ${ADMIN_PASSWORD:admin123}
    demo-email: ${DEMO_EMAIL:}
    demo-password: ${DEMO_PASSWORD:}
  site-url: ${SITE_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:LegaldocsGPT <noreply@legaldocsgpt.com>}


spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://auth-db:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope:
              - email
              - profile
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/login/oauth2/code/google}
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://www.googleapis.com/oauth2/v4/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
    org.springframework.web: ${LOG_LEVEL_WEB:INFO}
    com.legaldocsgpt: ${LOG_LEVEL_APP:INFO}
    root: INFO